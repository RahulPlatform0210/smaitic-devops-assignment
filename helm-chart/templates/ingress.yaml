apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: smaitic-api-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: smaitic-api-service

                port:
                  number: {{ .Values.service.port }}